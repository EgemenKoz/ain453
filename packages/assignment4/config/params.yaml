# ─────────────────────────────────────────────────────────────────────────────
# Assignment 4 – A* + DWA parameters (simplified for noisy real hardware)
#
# Cost: path + goal + obstacle.  Velocity is constant (DWA only samples ω).
# ─────────────────────────────────────────────────────────────────────────────

workspace:
  x_min: 0.0
  x_max: 1.5
  y_min: 0.0
  y_max: 1.5

grid:
  resolution_m: 0.05
  allow_diagonal: true

start:
  x: 0.15
  y: 0.15
  theta: 0.0

goal:
  x: 1.35
  y: 1.35
  tol_m: 0.25             # generous — encoder drift makes 15 cm too tight

obstacle:
  x: 0.75
  y: 0.75
  radius_m: 0.08

robot:
  radius_m: 0.06
  safety_margin_m: 0.04
  wheel_base_m: 0.10
  wheel_radius_m: 0.0318
  ticks_per_rev: 135
  left_sign:  1.0
  right_sign: 1.0
  pose_log_throttle_s: 0.5

sensing:
  radius_m: 0.40

dwa:
  v_min: 0.10
  v_max: 0.10             # constant velocity (v_min == v_max, v_samples = 1)
  w_min: -2.0
  w_max:  2.0
  v_samples: 1
  w_samples: 11
  alpha_max: 8.0          # ω rate-limit (rad/s²) for smoothness
  window_dt: 0.3
  horizon_s: 1.0          # short horizon — long-future drift is meaningless
  dt: 0.1
  weights:
    path: 1.0             # distance to global path
    goal: 1.5             # distance to goal (slightly stronger than path)
    obstacle: 3.0         # clearance from inflated obstacle
  safe_clear_m: 0.18      # obstacle cost zero once clearance exceeds this
  reject_in_inflated: true

control:
  rate_hz: 10
  linear_max: 0.15
  angular_max: 2.0

viz:
  rate_hz: 5
  show_rejected: true

path:
  densify_step_m: 0.02
